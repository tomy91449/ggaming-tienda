# Lee el archivo .env de la carpeta del proyecto (si existe). Sus valores
# se usan como si fueran variables de entorno. "optional:" = si no está, no falla.
spring.config.import=optional:file:.env[.properties]

# ---------- Configuración por variables de entorno ----------
# Sintaxis ${VARIABLE:valor_por_defecto}: si la variable no existe, usa el default.
# Formato internacional sin "+" ni espacios: 54 (Argentina) + 9 (celular) + 3834507890
app.whatsapp-number=${WHATSAPP_NUMBER:5493834507890}
app.base-url=${BASE_URL:http://localhost:8080}
# Usuario y contraseña del panel /admin. ¡En producción poné una contraseña larga!
app.admin-user=${ADMIN_USER:admin}
app.admin-password=${ADMIN_PASSWORD:admin}
# Firma la cookie "recordarme". En producción: una cadena larga y aleatoria.
app.secret-key=${SECRET_KEY:cambiame-en-produccion}
# Carpeta donde se guardan las fotos subidas (hay que incluirla en los backups).
app.uploads-dir=${UPLOADS_DIR:uploads}

# ---------- IA: Gemini (Google AI Studio) ----------
# Sin API key, la IA queda desactivada pero el historial de ventas funciona igual.
app.ia.api-key=${GEMINI_API_KEY:}
app.ia.modelo=${GEMINI_MODEL:gemini-3.5-flash}
app.ia.busqueda-web=${GEMINI_BUSQUEDA:true}
app.ia.url-base=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# Puerto (los hostings gratuitos suelen pasar PORT)
server.port=${PORT:8080}

# ---------- Base de datos SQLite ----------
# Un único archivo en la carpeta desde donde se ejecuta la app.
spring.datasource.url=jdbc:sqlite:${DB_PATH:jcomponentes.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite permite un solo escritor a la vez: con una conexión evitamos bloqueos.
spring.datasource.hikari.maximum-pool-size=1

# ---------- Subida de fotos ----------
# Las fotos de celular pesan 3-8 MB; después se comprimen a ~200 KB.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=80MB

# ---------- Seguridad ----------
# Nunca mostrar detalles internos (stacktrace, mensajes de excepción) en páginas de error.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
# Detrás del proxy HTTPS del hosting: Tomcat solo confía en X-Forwarded-* si vienen
# de una IP interna (así nadie puede falsificar su IP para saltear el bloqueo de login).
server.forward-headers-strategy=native
# Cookie de sesión: inaccesible desde JS y no se envía desde otros sitios.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h

# Al arrancar ejecuta schema.sql (crea tablas) y data.sql (datos de ejemplo).
spring.sql.init.mode=always
