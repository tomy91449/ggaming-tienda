# Lee el archivo .env de la carpeta del proyecto (si existe). Sus valores
# se usan como si fueran variables de entorno. "optional:" = si no está, no falla.
spring.config.import=optional:file:.env[.properties]

# ---------- Configuración por variables de entorno ----------
# Sintaxis ${VARIABLE:valor_por_defecto}: si la variable no existe, usa el default.
# Número del BOT (al que escriben los clientes). Formato internacional sin "+" ni espacios.
app.whatsapp-number=${WHATSAPP_NUMBER:5493515599430}
app.base-url=${BASE_URL:http://localhost:8080}
# Usuario y contraseña del panel /admin. ¡En producción poné una contraseña larga!
app.admin-user=${ADMIN_USER:admin}
app.admin-password=${ADMIN_PASSWORD:admin}
# Firma la cookie "recordarme". En producción: una cadena larga y aleatoria.
app.secret-key=${SECRET_KEY:cambiame-en-produccion}
# Carpeta donde se guardan las fotos subidas (hay que incluirla en los backups).
app.uploads-dir=${UPLOADS_DIR:uploads}

# ---------- IA: Gemini (Google AI Studio) ----------
# Sin API key, la IA queda desactivada pero el historial de ventas funciona igual.
app.ia.api-key=${GEMINI_API_KEY:}
app.ia.modelo=${GEMINI_MODEL:gemini-3.5-flash}
# Si el modelo principal se queda sin cuota, se usa este automáticamente (más límite gratis).
app.ia.modelo-respaldo=${GEMINI_MODELO_RESPALDO:gemini-3.5-flash-lite}
# Búsqueda en Google: en el plan gratuito agota la cuota al primer uso. Activar solo con facturación.
app.ia.busqueda-web=${GEMINI_BUSQUEDA:false}
app.ia.url-base=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# ---------- Bot de WhatsApp (WhatsApp Cloud API de Meta) ----------
# Sin WHATSAPP_TOKEN el bot no envía mensajes, pero el simulador del admin funciona igual.
app.bot.token=${WHATSAPP_TOKEN:}
app.bot.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.bot.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.bot.app-secret=${WHATSAPP_APP_SECRET:}
# Tu WhatsApp personal: ahí llegan los avisos del bot.
app.bot.numero-dueno=${DUENO_WHATSAPP:5493834507890}
app.bot.graph-url=${WHATSAPP_GRAPH_URL:https://graph.facebook.com/v23.0}
# Plantillas aprobadas por Meta para avisarte aunque no le hayas escrito al bot en 24 hs (opcional).
app.bot.plantilla-consulta=${WHATSAPP_PLANTILLA_CONSULTA:}
app.bot.plantilla-turno=${WHATSAPP_PLANTILLA_TURNO:}
app.bot.idioma-plantilla=${WHATSAPP_IDIOMA_PLANTILLA:es_AR}
# Horas que el bot se queda callado en un chat después de derivártelo.
app.bot.horas-pausa=${BOT_HORAS_PAUSA:12}
app.bot.max-mensajes-por-hora=${BOT_MAX_MENSAJES_HORA:30}

# ---------- Datos de la tienda (los usa el bot) ----------
# Vacío = usa el texto por defecto (está en TiendaProperties.java, con acentos).
app.tienda.direccion=${TIENDA_DIRECCION:}
app.tienda.apertura=${TIENDA_APERTURA:08:00}
app.tienda.cierre=${TIENDA_CIERRE:21:00}
app.tienda.pagos=${TIENDA_PAGOS:}
app.tienda.entrega=${TIENDA_ENTREGA:}
app.tienda.garantia=${TIENDA_GARANTIA:}
app.tienda.zona-horaria=${TIENDA_ZONA_HORARIA:America/Argentina/Cordoba}
# Opcional: clave de Google Cloud con "Maps Embed API" activada (gratis). Sin clave el mapa igual se ve.
app.tienda.maps-api-key=${GOOGLE_MAPS_API_KEY:}

# Puerto (los hostings gratuitos suelen pasar PORT)
server.port=${PORT:8080}

# ---------- Base de datos SQLite ----------
# Un único archivo en la carpeta desde donde se ejecuta la app.
spring.datasource.url=jdbc:sqlite:${DB_PATH:jcomponentes.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite permite un solo escritor a la vez: con una conexión evitamos bloqueos.
spring.datasource.hikari.maximum-pool-size=1

# ---------- Subida de fotos ----------
# Las fotos de celular pesan 3-8 MB; después se comprimen a ~200 KB.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=80MB

# ---------- Seguridad ----------
# Nunca mostrar detalles internos (stacktrace, mensajes de excepción) en páginas de error.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
# Detrás del proxy HTTPS del hosting: Tomcat solo confía en X-Forwarded-* si vienen
# de una IP interna (así nadie puede falsificar su IP para saltear el bloqueo de login).
server.forward-headers-strategy=native
# Cookie de sesión: inaccesible desde JS y no se envía desde otros sitios.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h

# Máximo de pedidos por minuto por IP (sin contar CSS/JS/imágenes). Más que eso = 429.
app.limite-por-minuto=${LIMITE_POR_MINUTO:120}

# ---------- Archivos estáticos (CSS, JS, imágenes) ----------
# Cada archivo se sirve con una huella en el nombre (estilos-3f2a....css): el navegador lo guarda
# un año y, cuando cambia, el nombre cambia solo. Visitas repetidas cargan mucho más rápido.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Al arrancar ejecuta schema.sql (crea tablas) y data.sql (datos de ejemplo).
spring.sql.init.mode=always
