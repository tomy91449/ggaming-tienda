<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  ÍCONOS SVG (estilo línea, como Lucide). Usan stroke="currentColor",
  así toman el color del CSS (el cian con brillo de la estética).
  aria-hidden: son decorativos, el texto al lado ya dice qué es.
-->

<!-- Ícono por categoría: se muestra cuando el producto no tiene foto -->
<svg th:fragment="categoria(nombre)" class="icono-categoria" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" th:switch="${nombre}">
    <th:block th:case="'PLACA_VIDEO'">
        <rect x="2" y="6" width="20" height="11" rx="1"/><circle cx="8" cy="11.5" r="3"/>
        <circle cx="16" cy="11.5" r="3"/><path d="M4 17v2M7 17v2M10 17v2"/>
    </th:block>
    <th:block th:case="'PROCESADOR'">
        <rect x="5" y="5" width="14" height="14" rx="1"/><rect x="9" y="9" width="6" height="6"/>
        <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
    </th:block>
    <th:block th:case="'RAM'">
        <path d="M3 7h18v9H3z"/><path d="M6 10v3M10 10v3M14 10v3M18 10v3M5 16v3M19 16v3"/>
    </th:block>
    <th:block th:case="'DISCO'">
        <path d="M22 12H2"/>
        <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
        <path d="M6 16h.01M10 16h.01"/>
    </th:block>
    <th:block th:case="'FUENTE'">
        <rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="10" cy="12" r="4"/>
        <path d="M10 8v8M6 12h8M17 9v6"/>
    </th:block>
    <th:block th:case="'MOTHERBOARD'">
        <rect x="3" y="3" width="18" height="18" rx="1"/><rect x="6" y="6" width="5" height="5"/>
        <path d="M14 6h4M14 9h4M6 14h12M6 17h12"/>
    </th:block>
    <th:block th:case="'GABINETE'">
        <rect x="6" y="2" width="12" height="20" rx="1"/><circle cx="12" cy="15" r="3"/>
        <path d="M9 6h6M9 9h6"/>
    </th:block>
    <th:block th:case="'TECLADO'">
        <rect x="2" y="6" width="20" height="12" rx="2"/>
        <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>
    </th:block>
    <th:block th:case="'MOUSE'">
        <rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/>
    </th:block>
    <th:block th:case="'MONITOR'">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
    </th:block>
    <th:block th:case="'AURICULAR'">
        <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
    </th:block>
    <th:block th:case="*">
        <path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>
    </th:block>
</svg>

<svg th:fragment="ubicacion" class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
</svg>

<svg th:fragment="buscar" class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
</svg>

<svg th:fragment="chip" class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
    <rect x="6" y="6" width="12" height="12" rx="1"/><rect x="10" y="10" width="4" height="4"/>
    <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>
</svg>

<svg th:fragment="carrito" class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>
    <path d="M2 3h3l2.7 12.4a1.5 1.5 0 0 0 1.5 1.1h8.6a1.5 1.5 0 0 0 1.5-1.1L21 7H6"/>
</svg>

<svg th:fragment="cerrar" class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <path d="M18 6 6 18M6 6l12 12"/>
</svg>

</html>
